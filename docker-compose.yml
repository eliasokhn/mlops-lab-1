services:
  mlflow:
    build: ./mlflow
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
  inference:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: ${MODEL_URI:-models:/food11@champion}
    depends_on:
      mlflow:
        condition: service_healthy
    restart: on-failure
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      INFERENCE_URL: http://inference:8000
    depends_on:
      - inference
volumes:
  mlflow-data:
